<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>The Resident Bookkeeper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: black ledger-spine sidebar carrying the 16 modules, white working desk to the right; gold marks rank, red marks what is overdue. */
:root{--bg:#f5f4f1;--surface:#ffffff;--sunk:#efede8;--ink:#17140f;--muted:#6a6358;--line:#e2ded6;--gold:#b08a2e;--gold-ink:#7a5a10;--red:#b0121c;--ok:#1d7a4c;--warn:#9a5b00;--side:#0d0c0b;--side-ink:#e8dfcb;--side-mut:#9a917f;--side-line:#27231d;--chip:#f1ede4;--pri:#17140f;--pri-ink:#f3e6c2;--shade:rgba(20,15,5,.45);
--disp:'Cinzel','Trajan Pro',Georgia,serif;--body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0b0a;--surface:#171513;--sunk:#1f1c19;--ink:#f1ece2;--muted:#a39a8b;--line:#2e2a24;--gold:#c9a544;--gold-ink:#dcb95c;--red:#f06a6e;--ok:#5cc48e;--warn:#e3a84f;--side:#050505;--side-ink:#e8dfcb;--side-mut:#9a917f;--side-line:#211e19;--chip:#24201b;--pri:#d9b65a;--pri-ink:#14110b;--shade:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0b0a;--surface:#171513;--sunk:#1f1c19;--ink:#f1ece2;--muted:#a39a8b;--line:#2e2a24;--gold:#c9a544;--gold-ink:#dcb95c;--red:#f06a6e;--ok:#5cc48e;--warn:#e3a84f;--side:#050505;--side-ink:#e8dfcb;--side-mut:#9a917f;--side-line:#211e19;--chip:#24201b;--pri:#d9b65a;--pri-ink:#14110b;--shade:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
#app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
#side{background:var(--side);color:var(--side-ink);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:16px 10px}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 14px;border-bottom:1px solid var(--side-line);margin-bottom:6px}
.brand img{width:44px;height:44px;border-radius:50%;flex:none}
.brand b{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.14em;line-height:1.25;display:block;color:var(--side-ink)}
.brand small{color:var(--red);font-family:var(--disp);letter-spacing:.2em;font-size:9px;display:block}
:root .brand small{color:#e0464d}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--side-mut);padding:8px 8px;border-radius:6px;cursor:pointer;text-align:left;width:100%}
.nav button svg{width:17px;height:17px;flex:none}
.nav button i{font-style:normal;font-size:10px;font-variant-numeric:tabular-nums;opacity:.6;width:16px}
.nav button:hover{color:var(--side-ink);background:var(--side-line)}
.nav button.on{color:#f3d98a;background:var(--side-line)}
.nav button:focus-visible,.btn:focus-visible,.tile:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sidefoot{margin-top:auto;font-size:11px;color:var(--side-mut);padding:10px 8px 0;border-top:1px solid var(--side-line)}
#main{min-width:0;display:flex;flex-direction:column}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 24px}
#bar .sp{flex:1}
#menu{display:none}
#view{padding-block:22px 60px;padding-inline:24px;display:flex;flex-direction:column;gap:18px;max-width:1280px;width:100%}
.ph{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.ph h1{font-family:var(--disp);font-weight:600;font-size:22px;letter-spacing:.04em}
.ph p{margin:2px 0 0;color:var(--muted);max-width:65ch}
.ph .sp{flex:1}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card h2{font-size:14px;font-weight:700;margin-bottom:10px}
.card h2 small{font-weight:400;color:var(--muted);margin-left:6px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.kpi.bad b{color:var(--red)}.kpi.good b{color:var(--ok)}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}
@media (max-width:1180px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:460px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--side);color:var(--side-ink);border:1px solid var(--side-line);border-radius:8px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;text-align:center;position:relative}
.tile svg{width:26px;height:26px;color:#d9b65a}
.tile i{font-style:normal;font-size:10px;color:var(--side-mut);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;font-weight:500}
.tile:hover{border-color:#d9b65a}
.tile u{position:absolute;top:7px;right:7px;text-decoration:none;background:#b0121c;color:#fff;border-radius:9px;font-size:10px;padding:1px 6px;font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.red{color:var(--red)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0}
textarea{width:100%;min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f>input,label.f>select{width:100%}
label.ck{display:flex;gap:7px;align-items:center;font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.t th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t .n{text-align:right;white-space:nowrap}
.t tr.tot td{font-weight:700;border-top:2px solid var(--ink);background:var(--sunk)}
.t tr.sub td{font-weight:600}
.t tr.hd td{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink);font-weight:700;padding-top:14px}
.t td.ind{padding-left:24px}
.t select{padding:3px 6px;font-size:12px;max-width:210px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.bad{color:var(--red)}.chip.warn{color:var(--warn)}.chip.gold{color:var(--gold-ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:26px 18px;text-align:center;color:var(--muted);background:var(--surface)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .row{justify-content:center;margin-top:12px}
.mut{color:var(--muted)}.bad{color:var(--red)}.good{color:var(--ok)}.sm{font-size:12px}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;background:var(--gold)}
.note{background:var(--chip);border-radius:6px;padding:9px 12px;font-size:13px;color:var(--muted)}
.note b{color:var(--ink)}
.list{display:flex;flex-direction:column}
.list>div{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list>div:last-child{border:0}
.list .gr{flex:1;min-width:140px}
#modal{position:fixed;inset:0;background:var(--shade);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
#modal .box{background:var(--surface);border-radius:10px;width:min(100%,620px);padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
#modal h2{font-size:16px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .full{grid-column:1/-1}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--pri);color:var(--pri-ink);padding:9px 16px;border-radius:20px;z-index:30;font-weight:500;max-width:90vw}
#banner{background:var(--chip);color:var(--warn);padding:8px 24px;font-size:13px;border-bottom:1px solid var(--line)}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--muted);font-size:11px;font-family:var(--body)}
pre.out{white-space:pre-wrap;font-family:var(--body);background:var(--sunk);padding:12px;border-radius:6px;margin:0;user-select:all}
@media (max-width:860px){
#app{grid-template-columns:minmax(0,1fr)}
#side{position:fixed;inset:0 auto 0 0;width:250px;z-index:15;transform:translateX(-100%);transition:transform .18s;padding-top:calc(16px + env(safe-area-inset-top,0px))}
#app.open #side{transform:none}
#menu{display:inline-block}
#bar{padding-inline:16px}#view{padding-inline:16px}#banner{padding-inline:16px}
.fg{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){#side{transition:none}}
#auth{position:fixed;inset:0;background:var(--side);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.abox{background:var(--surface);border-radius:12px;padding:28px;width:min(100%,380px);display:flex;flex-direction:column;gap:10px;align-items:stretch;text-align:center;border:1px solid var(--line)}
.abox img{width:76px;height:76px;border-radius:50%;align-self:center}
.abox small{font-family:var(--disp);color:var(--red);letter-spacing:.3em;font-size:10px}
.abox b{font-family:var(--disp);letter-spacing:.14em;font-size:15px}
.abox form{display:flex;flex-direction:column;gap:12px;text-align:left;margin-top:6px}
.abox p{margin:0}
.aerr{color:var(--red);font-size:13px;min-height:18px}
.pwwrap{position:relative;display:block}.pwwrap input{width:100%;padding-right:64px}.pwbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--gold-ink);font-weight:600;cursor:pointer;padding:4px 8px}.pwbtn:focus-visible{outline:2px solid var(--gold);border-radius:4px}
.abox a{color:var(--gold-ink)}
[hidden]{display:none!important}
html,body{margin:0}
</style>
